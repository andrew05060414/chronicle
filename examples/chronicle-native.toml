# Native backup configuration. Passwords stay outside this file.
data_root = "D:/Data/chronicle-native"
restic = "D:/Data/chronicle-native/tools/restic.exe"
password_file = "D:/Secrets/chronicle-restic-password.txt"
local_repository = "D:/Data/chronicle-native/repository"
remote_repository = "sftp:backup-host:/backups/chronicle-native/device-name"

# components defaults to sessions; add only verified non-credential components.
components = ["sessions"]
